<!doctype html>
<html>
    <head>
        <link rel = "styleSheet" href = "style.css">
        <title>Ball Game</title>
    </head>

    <body>
        <!--Create the side for the balls-->
        <div id = "gameArea">
            
        </div>
        
        <!--Shop-->
        <div id = "shop">
            <h1>Buy Balls</h1>
            <p id = "showScore">Score: 1</p>

            <!--Allow shop to display correctly-->
            <div class = "shopItem">
                <p>Buy Standard Ball</p>
                <button onclick = "addStandardBall()" id = "standardButton">Cost: 1</button>
            </div>

            <div class = "shopItem">
                <p>Buy Big Ball</p>
                <button onclick = "addBigBall()" id = "bigButton">Cost: 30</button>
            </div>

            <div class = "shopItem">
                <p>Buy Red Ball</p>
                <button onclick = "addRedBall()" id = "redButton">Cost: 100</button>
            </div>

            <div class = "shopItem">
                <p>Buy Automover</p>
                <button onclick = "addAutomover()" id = "automoverButton">Cost: 120</button>
            </div>
        </div>
        <script src = "script.js"></script>
    </body>
</html>
