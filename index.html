<!doctype html>
<html>
    <head>
        <link rel = "styleSheet" href = "style.css">
        <title>Ball Game</title>
    </head>

    <body>
        <!--Create the side for the balls-->
        <div id = "gameArea">
            
        </div>
        
        <!--Shop-->
        <div id = "shop">
            <h1>Buy Balls</h1>
            <p id = "showScore">Score: 1</p>

            <!--Allow shop to display correctly-->
            <div class = "shopItem">
                <p>Buy Standard Ball</p>
                <button onclick = "addStandardBall()" id = "standardButton">Cost: 1</button>
            </div>

            <div class = "shopItem">
                <p>Buy Big Ball</p>
                <button onclick = "addBigBall()" id = "bigButton">Cost: 30</button>
            </div>

            <div class = "shopItem">
                <p>Buy Red Ball</p>
                <button onclick = "addRedBall()" id = "redButton">Cost: 40</button>
            </div>

            <div class = "shopItem">
                <p>Buy Automover</p>
                <button onclick = "addAutomover()" id = "automoverButton">Cost: 120</button>
            </div>

            <div class = "shopItem">
                <p>Buy Golden Ball</p>
                <button onclick = "addGoldenBall()" id = "goldenButton">Cost: 1000</button>
            </div>

            <div class = "shopItem">
                <p>Buy Tiny Ball</p>
                <button onclick = "addTinyBall()" id = "tinyButton">Cost: 50</button>
            </div>

            <div class = "shopItem">
                <p>Buy Lucky Ball</p>
                <button onclick = "addLuckyBall()" id = "luckyButton">Cost 10000</button>
            </div>

            <hr>
            
            <div class = "shopItem">
                <p>Upgrade Income</p>
                <button onclick = "upgradeIncome()" id = "upgradeIncomeButton">Cost: 25</button>
            </div>

            <div class = "shopItem">
                <p id = "showMultiplier">Upgrade Multiplier x1</p>
                <button onclick = "upgradeMultiplier()" id = "upgradeMultiplierButton">Cost: 200</button>
            </div>

            <div class = "shopItem">
                <p>Upgrade Automovers</p>
                <button onclick = "upgradeAutomover()" id = "upgradeAutomoverButton">Cost: 100</button>
            </div>

            <div class = "shopItem">
                <p>Upgrade Lucky Balls</p>
                <button onclick = "upgradeLuckyBalls()" id = "upgradeLuckyBallsButton">Cost: 20000</button>
            </div>
        </div>
        <script src = "script.js"></script>
    </body>
</html>
